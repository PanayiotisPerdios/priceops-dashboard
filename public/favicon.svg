<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGradient" x1="8" y1="6" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- cloud silhouette: overlapping shapes, same fill, no stroke, reads as one solid mark -->
  <g fill="url(#cloudGradient)">
    <rect x="10" y="32" width="44" height="22" rx="11" />
    <circle cx="20" cy="30" r="13" />
    <circle cx="34" cy="22" r="16" />
    <circle cx="47" cy="31" r="12" />
  </g>

  <!-- provider network: same 3-node motif as the Home hero background and
       the Evaluation quadrant chart's provider colors -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2">
    <line x1="18" y1="41" x2="34" y2="35" />
    <line x1="34" y1="35" x2="48" y2="41" />
    <line x1="18" y1="41" x2="48" y2="41" />
  </g>

  <g filter="url(#softGlow)">
    <circle cx="18" cy="41" r="3" fill="#f0932b" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.8" />
    <circle cx="34" cy="35" r="3" fill="#0078d4" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.8" />
    <circle cx="48" cy="41" r="3" fill="#4285f4" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.8" />
  </g>
</svg>
